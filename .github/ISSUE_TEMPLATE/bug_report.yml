name: Bug Report
description: Create a report to help us improve SAFE
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: SAFE Version
      description: What version of SAFE are you using? (e.g., v1.0.0)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS was the collection/analysis run on? (e.g., Windows 10 22H2, Ubuntu 22.04)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Panics
      description: Paste any error output or Go panics here.
    validations:
      required: false
