name: Feature Request
description: Suggest an idea, parser, or new detection rule for SAFE
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SAFE!
  - type: textarea
    id: description
    attributes:
      label: Description of Feature
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: DFIR Use Case
      description: How does this help an Incident Responder? Provide an example scenario.
    validations:
      required: true
